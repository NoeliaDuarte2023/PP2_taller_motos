<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        
    </header>
    <div class="franja"></div>
    <main class="contenido">
        <div class="panel panel--login">
            <h1>Ingreso</h1>
            <p class="bajada">Ingresá con tu usuario para registrar clientes, motos y servicios.</p>

            <form id="formLogin">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password">

                <button type="submit">Ingresar</button>
            </form>

            <div id="resultado" role="status" aria-live="polite"></div>
        </div>
    </main>

    <script>
        const form = document.getElementById("formLogin");
        const resultado = document.getElementById("resultado");

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const datos = new URLSearchParams();
            datos.append("usuario", document.getElementById("usuario").value);
            datos.append("password", document.getElementById("password").value);

            try {
                const respuesta = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    // Ingreso correcto: ir al panel del taller
                    window.location.href = "/panel";
                } else {
                    resultado.style.display = "block";
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
