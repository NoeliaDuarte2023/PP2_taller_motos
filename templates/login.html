<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso - Taller de Motos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
        h1 { font-size: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
        #resultado { margin-top: 20px; padding: 12px; border-radius: 4px; display: none; }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Ingreso - Taller de Motos</h1>

    <form id="formLogin">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" autocomplete="username">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password">

        <button type="submit">Ingresar</button>
    </form>

    <div id="resultado"></div>

    <script>
        const form = document.getElementById("formLogin");
        const resultado = document.getElementById("resultado");

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const datos = new URLSearchParams();
            datos.append("usuario", document.getElementById("usuario").value);
            datos.append("password", document.getElementById("password").value);

            try {
                const respuesta = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    // Ingreso correcto: ir al formulario de clientes
                    window.location.href = "/";
                } else {
                    resultado.style.display = "block";
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
