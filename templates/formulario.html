<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de clientes - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        <a href="/logout">Cerrar sesión</a>
    </header>
    <div class="franja"></div>
    <main class="contenido">
        <ol class="pasos" aria-label="Pasos del registro">
            <li class="paso paso--actual" aria-current="step"><span class="paso__numero">1</span>Cliente</li>
            <li class="paso"><span class="paso__numero">2</span>Moto</li>
            <li class="paso"><span class="paso__numero">3</span>Servicio</li>
        </ol>
        <div class="panel">
            <h1>Registrar cliente</h1>
            <p class="bajada">Al guardar, pasás directo a cargar la moto de este cliente.</p>

            <form id="formCliente">
                <div class="fila">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre">
                    </div>
                    <div>
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido">
                    </div>
                </div>

                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" name="telefono" inputmode="numeric">

                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion">

                <button type="submit">Registrar cliente</button>
            </form>

            <div id="resultado" role="status" aria-live="polite"></div>
        </div>
    </main>

    <script>
        const form = document.getElementById("formCliente");
        const resultado = document.getElementById("resultado");

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            // Se arma el cuerpo de la solicitud igual que un formulario clasico,
            // para que Flask lo reciba con request.form
            const datos = new URLSearchParams();
            datos.append("nombre", document.getElementById("nombre").value);
            datos.append("apellido", document.getElementById("apellido").value);
            datos.append("telefono", document.getElementById("telefono").value);
            datos.append("direccion", document.getElementById("direccion").value);

            try {
                const respuesta = await fetch("/clientes", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos
                });

                const data = await respuesta.json();

                resultado.style.display = "block";
                if (respuesta.ok) {
                    resultado.className = "exito";
                    resultado.textContent = "Éxito (" + respuesta.status + "): " + data.mensaje + " ID: " + data.id +
                        ". Pasando al registro de la moto...";
                    // Flujo guiado: se pasa solo a cargar la moto de este cliente
                    setTimeout(function () {
                        window.location.href = "/motos/nueva?cliente_id=" + encodeURIComponent(data.id);
                    }, 2500);
                } else {
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
