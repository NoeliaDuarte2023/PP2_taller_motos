<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Motos - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body class="ancho">
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        <nav class="barra__nav">
            <a href="/panel">Panel</a>
            <a href="/clientes/lista">Clientes</a>
            <a href="/motos/lista">Motos</a>
            <a href="/logout">Cerrar sesión</a>
        </nav>
    </header>
    <div class="franja"></div>
    <main class="contenido contenido--ancho">
        <div class="panel">
            <div class="panel__cabecera">
                <div>
                    <h1>Motos</h1>
                    <p class="bajada" id="resumen">Cargando...</p>
                </div>
                <div class="acciones">
                    <a class="boton" href="/motos/nueva">Registrar moto</a>
                </div>
            </div>

            <div class="filtros" id="filtros" hidden>
                <input type="search" id="buscar" placeholder="Buscar por patente, moto o dueño" aria-label="Buscar">
            </div>

            <div class="tabla-contenedor">
                <table class="tabla" id="tablaMotos" hidden>
                    <thead>
                        <tr>
                            <th>Patente</th>
                            <th>Moto</th>
                            <th>Año</th>
                            <th>Dueño</th>
                            <th>Teléfono</th>
                            <th class="num">Servicios</th>
                            <th class="num">En proceso</th>
                        </tr>
                    </thead>
                    <tbody id="filasMotos"></tbody>
                </table>
            </div>

            <div id="sinCoincidencias" class="vacio" hidden>
                <strong>No hay resultados para esa búsqueda.</strong>
                <span>Probá con otra patente o nombre.</span>
            </div>
            <div id="vacio" class="vacio" hidden>
                <strong>Todavía no hay motos registradas.</strong>
                <span>Usá «Registrar moto» para cargar la primera.</span>
            </div>
            <div id="resultado" role="status" aria-live="polite"></div>
        </div>
    </main>

    <script>
        const tabla = document.getElementById("tablaMotos");
        const filas = document.getElementById("filasMotos");
        const vacio = document.getElementById("vacio");
        const resumen = document.getElementById("resumen");
        const resultado = document.getElementById("resultado");

        // Crea una celda con texto (textContent: los datos cargados nunca se interpretan como HTML)
        function celda(texto, clase) {
            const td = document.createElement("td");
            td.textContent = texto;
            if (clase) td.className = clase;
            return td;
        }

        // Oculta las filas que no coinciden con lo escrito en el buscador
        function filtrar() {
            const texto = document.getElementById("buscar").value.trim().toLowerCase();
            let visibles = 0;
            filas.querySelectorAll("tr").forEach(tr => {
                const coincide = texto === "" || (tr.dataset.texto || "").includes(texto);
                tr.hidden = !coincide;
                if (coincide) visibles++;
            });
            document.getElementById("sinCoincidencias").hidden = visibles !== 0;
        }
        document.getElementById("buscar").addEventListener("input", filtrar);

        async function cargarMotos() {
            try {
                const respuesta = await fetch("/motos/datos");
                const data = await respuesta.json();

                if (!respuesta.ok) {
                    resumen.textContent = "No se pudo cargar el listado.";
                    resultado.style.display = "block";
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                    return;
                }

                const motos = data.motos;
                if (motos.length === 0) {
                    resumen.textContent = "Sin motos por ahora.";
                    vacio.hidden = false;
                    return;
                }
                resumen.textContent = motos.length + (motos.length === 1 ? " moto registrada" : " motos registradas");

                motos.forEach(m => {
                    const tr = document.createElement("tr");
                    tr.dataset.texto = [m.patente, m.moto, m.anio, m.dueno].join(" ").toLowerCase();

                    // La patente lleva al historial de servicios de esa moto
                    const tdPatente = document.createElement("td");
                    const enlace = document.createElement("a");
                    enlace.href = "/motos/" + encodeURIComponent(m.id) + "/historial";
                    enlace.textContent = m.patente;
                    enlace.title = "Ver historial de servicios de esta moto";
                    tdPatente.appendChild(enlace);

                    tr.appendChild(tdPatente);
                    tr.appendChild(celda(m.moto));
                    tr.appendChild(celda(String(m.anio)));
                    tr.appendChild(celda(m.dueno));
                    tr.appendChild(celda(m.telefono));
                    tr.appendChild(celda(String(m.servicios), "num"));
                    tr.appendChild(celda(String(m.en_proceso), "num"));
                    filas.appendChild(tr);
                });
                tabla.hidden = false;
                document.getElementById("filtros").hidden = false;
            } catch (err) {
                resumen.textContent = "No se pudo cargar el listado.";
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        }
        cargarMotos();
    </script>
</body>
</html>
