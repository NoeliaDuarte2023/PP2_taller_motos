<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel del taller - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body class="ancho">
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        <nav class="barra__nav">
            <a href="/panel">Panel</a>
            <a href="/logout">Cerrar sesión</a>
        </nav>
    </header>
    <div class="franja"></div>
    <main class="contenido contenido--ancho">
        <div class="panel">
            <div class="panel__cabecera">
                <div>
                    <h1>Motos en el taller</h1>
                    <p class="bajada" id="resumen">Cargando...</p>
                </div>
                <div class="acciones">
                    <a class="boton" href="/">Registrar cliente nuevo</a>
                    <a class="boton boton--secundario" href="/motos/nueva">Registrar moto de un cliente</a>
                </div>
            </div>

            <div class="tabla-contenedor">
                <table class="tabla" id="tablaPanel" hidden>
                    <thead>
                        <tr>
                            <th>Estado</th>
                            <th>Patente</th>
                            <th>Moto</th>
                            <th>Dueño</th>
                            <th>Trabajo</th>
                            <th class="num">Monto</th>
                            <th>Ingreso</th>
                            <th class="num">Días</th>
                            <th>Retiro</th>
                        </tr>
                    </thead>
                    <tbody id="filasPanel"></tbody>
                </table>
            </div>

            <div id="vacio" class="vacio" hidden>
                <strong>Todavía no hay motos registradas.</strong>
                <span>Registrá un cliente para empezar: después cargás su moto y el trabajo a realizar.</span>
            </div>
            <div id="resultado" role="status" aria-live="polite"></div>
        </div>
    </main>

    <script>
        const tabla = document.getElementById("tablaPanel");
        const filas = document.getElementById("filasPanel");
        const vacio = document.getElementById("vacio");
        const resumen = document.getElementById("resumen");
        const resultado = document.getElementById("resultado");

        const formatoMonto = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS" });

        // Crea una celda con texto (textContent: los datos cargados nunca se interpretan como HTML)
        function celda(texto, clase) {
            const td = document.createElement("td");
            td.textContent = texto;
            if (clase) td.className = clase;
            return td;
        }

        function celdaEstado(estado) {
            const td = document.createElement("td");
            const marca = document.createElement("span");
            marca.className = "estado " + (estado === "Completo" ? "estado--completo" : "estado--proceso");
            marca.textContent = estado;
            td.appendChild(marca);
            return td;
        }

        // Ultima columna: boton para marcar el retiro, o la fecha si ya fue retirada
        function celdaRetiro(r) {
            const td = document.createElement("td");
            if (r.estado === "Completo") {
                td.textContent = r.retiro || "";
                return td;
            }
            const boton = document.createElement("button");
            boton.type = "button";
            boton.className = "boton-tabla";
            boton.textContent = "Marcar retirada";
            boton.addEventListener("click", () => completar(r, boton));
            td.appendChild(boton);
            return td;
        }

        async function completar(r, boton) {
            if (!confirm("¿Confirmás que " + r.moto + " (" + r.patente + ") fue retirada por " + r.dueno + "?")) return;
            boton.disabled = true;
            try {
                const respuesta = await fetch("/panel/" + r.id + "/completar", { method: "POST" });
                const data = await respuesta.json();
                resultado.style.display = "block";
                if (respuesta.ok) {
                    resultado.className = "exito";
                    resultado.textContent = data.mensaje;
                    await cargarPanel();
                } else {
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                    boton.disabled = false;
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
                boton.disabled = false;
            }
        }

        async function cargarPanel() {
            filas.innerHTML = "";
            try {
                const respuesta = await fetch("/panel/datos");
                const data = await respuesta.json();

                if (!respuesta.ok) {
                    resumen.textContent = "No se pudo cargar el panel.";
                    resultado.style.display = "block";
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                    return;
                }

                const registros = data.registros;
                if (registros.length === 0) {
                    resumen.textContent = "Sin registros por ahora.";
                    vacio.hidden = false;
                    return;
                }

                const enProceso = registros.filter(r => r.estado !== "Completo").length;
                const completos = registros.length - enProceso;
                resumen.textContent = enProceso + " en proceso · " + completos + " completas";

                registros.forEach(r => {
                    const tr = document.createElement("tr");
                    tr.appendChild(celdaEstado(r.estado));
                    tr.appendChild(celda(r.patente));
                    tr.appendChild(celda(r.moto));
                    tr.appendChild(celda(r.dueno));
                    tr.appendChild(celda(r.trabajo));
                    tr.appendChild(celda(formatoMonto.format(r.monto), "num"));
                    tr.appendChild(celda(r.ingreso));
                    tr.appendChild(celda(String(r.dias), "num"));
                    tr.appendChild(celdaRetiro(r));
                    filas.appendChild(tr);
                });
                tabla.hidden = false;
            } catch (err) {
                resumen.textContent = "No se pudo cargar el panel.";
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        }

        cargarPanel();
    </script>
</body>
</html>
