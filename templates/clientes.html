<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body class="ancho">
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        <nav class="barra__nav">
            <a href="/panel">Panel</a>
            <a href="/clientes/lista">Clientes</a>
            <a href="/logout">Cerrar sesión</a>
        </nav>
    </header>
    <div class="franja"></div>
    <main class="contenido contenido--ancho">
        <div class="panel">
            <div class="panel__cabecera">
                <div>
                    <h1>Clientes</h1>
                    <p class="bajada" id="resumen">Cargando...</p>
                </div>
                <div class="acciones">
                    <a class="boton" href="/">Registrar cliente nuevo</a>
                </div>
            </div>
            <p class="bajada" id="avisoNuevo" hidden></p>

            <div class="tabla-contenedor">
                <table class="tabla" id="tablaClientes" hidden>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th class="num">Motos</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="filasClientes"></tbody>
                </table>
            </div>

            <div id="vacio" class="vacio" hidden>
                <strong>Todavía no hay clientes registrados.</strong>
                <span>Usá «Registrar cliente nuevo» para cargar el primero.</span>
            </div>
            <div id="resultado" role="status" aria-live="polite"></div>
        </div>
    </main>

    <script>
        const tabla = document.getElementById("tablaClientes");
        const filas = document.getElementById("filasClientes");
        const vacio = document.getElementById("vacio");
        const resumen = document.getElementById("resumen");
        const aviso = document.getElementById("avisoNuevo");
        const resultado = document.getElementById("resultado");

        // Si se llega desde el alta de un cliente, esa fila se resalta
        const nuevoId = new URLSearchParams(window.location.search).get("nuevo");

        function celda(texto, clase) {
            const td = document.createElement("td");
            td.textContent = texto;
            if (clase) td.className = clase;
            return td;
        }

        function botonTabla(texto, accion) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "boton-tabla";
            b.textContent = texto;
            b.addEventListener("click", accion);
            return b;
        }

        function mostrar(clase, texto) {
            resultado.style.display = "block";
            resultado.className = clase;
            resultado.textContent = texto;
        }

        async function enviar(url, datos) {
            try {
                const respuesta = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos || ""
                });
                const data = await respuesta.json();
                if (respuesta.ok) {
                    mostrar("exito", data.mensaje);
                    await cargarClientes();
                } else {
                    mostrar("error", "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data)));
                }
            } catch (err) {
                mostrar("error", "No se pudo conectar con el servidor.");
            }
        }

        // Edicion en la misma fila: solo telefono y direccion
        function editarFila(tr, c) {
            const celdas = tr.querySelectorAll("td");
            const tel = document.createElement("input");
            tel.value = c.telefono; tel.inputMode = "numeric";
            const dir = document.createElement("input");
            dir.value = c.direccion;
            celdas[1].textContent = ""; celdas[1].appendChild(tel);
            celdas[2].textContent = ""; celdas[2].appendChild(dir);
            celdas[4].textContent = "";
            celdas[4].appendChild(botonTabla("Guardar", () => {
                const datos = new URLSearchParams();
                datos.append("telefono", tel.value);
                datos.append("direccion", dir.value);
                enviar("/clientes/" + c.id + "/editar", datos);
            }));
            celdas[4].appendChild(botonTabla("Cancelar", () => cargarClientes()));
        }

        function borrarCliente(c) {
            if (!confirm("¿Borrar a " + c.nombre + " " + c.apellido + "? Esta acción no se puede deshacer.")) return;
            enviar("/clientes/" + c.id + "/borrar");
        }

        async function cargarClientes() {
            filas.innerHTML = "";
            try {
                const respuesta = await fetch("/clientes/datos");
                const data = await respuesta.json();

                if (!respuesta.ok) {
                    resumen.textContent = "No se pudo cargar la lista.";
                    resultado.style.display = "block";
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                    return;
                }

                const clientes = data.clientes;
                if (clientes.length === 0) {
                    resumen.textContent = "Sin clientes por ahora.";
                    vacio.hidden = false;
                    return;
                }
                resumen.textContent = clientes.length + (clientes.length === 1 ? " cliente registrado" : " clientes registrados");

                clientes.forEach(c => {
                    const tr = document.createElement("tr");
                    const esNuevo = nuevoId !== null && String(c.id) === nuevoId;
                    if (esNuevo) {
                        tr.className = "fila-nueva";
                        aviso.textContent = "Recién cargado: " + c.nombre + " " + c.apellido + ".";
                        aviso.hidden = false;
                    }
                    const nombre = celda(c.nombre + " " + c.apellido);
                    if (esNuevo) {
                        const marca = document.createElement("span");
                        marca.className = "etiqueta-nuevo";
                        marca.textContent = "Nuevo";
                        nombre.appendChild(marca);
                    }
                    tr.appendChild(nombre);
                    tr.appendChild(celda(c.telefono));
                    tr.appendChild(celda(c.direccion));
                    tr.appendChild(celda(String(c.motos), "num"));

                    const accion = document.createElement("td");
                    accion.className = "acciones-fila";
                    const enlace = document.createElement("a");
                    enlace.className = "boton-tabla";
                    enlace.href = "/motos/nueva?cliente_id=" + encodeURIComponent(c.id);
                    enlace.textContent = "Agregar moto";
                    accion.appendChild(enlace);
                    accion.appendChild(botonTabla("Editar", () => editarFila(tr, c)));
                    const borrar = botonTabla("Borrar", () => borrarCliente(c));
                    if (c.motos > 0) {
                        borrar.disabled = true;
                        borrar.title = "No se puede borrar: tiene motos registradas";
                    }
                    accion.appendChild(borrar);
                    tr.appendChild(accion);
                    filas.appendChild(tr);
                });
                tabla.hidden = false;
            } catch (err) {
                resumen.textContent = "No se pudo cargar la lista.";
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        }

        cargarClientes();
    </script>
</body>
</html>
