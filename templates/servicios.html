<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de servicios - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        <nav class="barra__nav">
            <a href="/panel">Panel</a>
            <a href="/clientes/lista">Clientes</a>
            <a href="/logout">Cerrar sesión</a>
        </nav>
    </header>
    <div class="franja"></div>
    <main class="contenido">
        <ol class="pasos" aria-label="Pasos del registro">
            <li class="paso paso--hecho"><span class="paso__numero">✓</span>Cliente</li>
            <li class="paso paso--hecho"><span class="paso__numero">✓</span>Moto</li>
            <li class="paso paso--actual" aria-current="step"><span class="paso__numero">3</span>Servicio</li>
        </ol>
        <div class="panel">
            <h1>Registrar servicio</h1>
            <p class="bajada">Al guardar, volvés al panel del taller.</p>

            <form id="formServicio">
                <label for="moto_id">ID de la moto</label>
                <input type="text" id="moto_id" name="moto_id" inputmode="numeric">
                <div class="ayuda">El ID aparece en el mensaje al registrar la moto.</div>

                <label for="fecha">Fecha del servicio</label>
                <input type="text" id="fecha" name="fecha" placeholder="AAAA-MM-DD">

                <label for="descripcion">Descripción</label>
                <input type="text" id="descripcion" name="descripcion">

                <label for="costo">Costo</label>
                <input type="text" id="costo" name="costo" inputmode="decimal">
                <div class="ayuda">Solo números, sin puntos de miles. Ej: 15000 o 15000,50</div>

                <button type="submit">Registrar servicio</button>
            </form>

            <div id="resultado" role="status" aria-live="polite"></div>
            <a class="enlace-volver" href="/panel">Volver al panel</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("formServicio");
        const resultado = document.getElementById("resultado");

        // Flujo guiado: si se llega desde el alta de una moto, el ID viene en la URL
        const idUrl = new URLSearchParams(window.location.search).get("moto_id");
        if (idUrl && /^[0-9]+$/.test(idUrl)) {
            const campo = document.getElementById("moto_id");
            campo.value = idUrl;
            campo.readOnly = true;
            document.querySelector("#formServicio .ayuda").textContent =
                "Moto cargada automaticamente desde el paso anterior.";
        }

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            // Mismo mecanismo que los otros formularios: cuerpo form-urlencoded
            const datos = new URLSearchParams();
            datos.append("moto_id", document.getElementById("moto_id").value);
            datos.append("fecha", document.getElementById("fecha").value);
            datos.append("descripcion", document.getElementById("descripcion").value);
            datos.append("costo", document.getElementById("costo").value);

            try {
                const respuesta = await fetch("/servicios", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos
                });

                const data = await respuesta.json();

                resultado.style.display = "block";
                if (respuesta.ok) {
                    resultado.className = "exito";
                    resultado.textContent = "Éxito (" + respuesta.status + "): " + data.mensaje + " ID: " + data.id +
                        ". Ciclo completo. Volviendo al panel...";
                    setTimeout(function () { window.location.href = "/panel"; }, 3500);
                } else {
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
