<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Servicios - Taller de Motos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
        h1 { font-size: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
        #resultado { margin-top: 20px; padding: 12px; border-radius: 4px; display: none; }
        .exito { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .ayuda { font-size: 12px; color: #555; margin-top: 2px; }
        a { font-size: 14px; }
    </style>
</head>
<body>
    <h1>Registro de Servicios - Taller de Motos</h1>
    <a href="/">&larr; Volver al inicio</a> &nbsp;|&nbsp; <a href="/logout">Cerrar sesión</a>

    <form id="formServicio">
        <label for="moto_id">ID de la moto</label>
        <input type="text" id="moto_id" name="moto_id">
        <div class="ayuda">El ID aparece en el mensaje al registrar la moto.</div>

        <label for="fecha">Fecha del servicio</label>
        <input type="text" id="fecha" name="fecha" placeholder="AAAA-MM-DD">

        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion" name="descripcion">

        <label for="costo">Costo</label>
        <input type="text" id="costo" name="costo">
        <div class="ayuda">Solo números, sin puntos de miles. Ej: 15000 o 15000,50</div>

        <button type="submit">Registrar servicio</button>
    </form>

    <div id="resultado"></div>

    <script>
        const form = document.getElementById("formServicio");
        const resultado = document.getElementById("resultado");

        // Flujo guiado: si se llega desde el alta de una moto, el ID viene en la URL
        const idUrl = new URLSearchParams(window.location.search).get("moto_id");
        if (idUrl && /^[0-9]+$/.test(idUrl)) {
            const campo = document.getElementById("moto_id");
            campo.value = idUrl;
            campo.readOnly = true;
            document.querySelector("#formServicio .ayuda").textContent =
                "Moto cargada automaticamente desde el paso anterior.";
        }

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            // Mismo mecanismo que los otros formularios: cuerpo form-urlencoded
            const datos = new URLSearchParams();
            datos.append("moto_id", document.getElementById("moto_id").value);
            datos.append("fecha", document.getElementById("fecha").value);
            datos.append("descripcion", document.getElementById("descripcion").value);
            datos.append("costo", document.getElementById("costo").value);

            try {
                const respuesta = await fetch("/servicios", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos
                });

                const data = await respuesta.json();

                resultado.style.display = "block";
                if (respuesta.ok) {
                    resultado.className = "exito";
                    resultado.textContent = "Éxito (" + respuesta.status + "): " + data.mensaje + " ID: " + data.id +
                        ". Ciclo completo. Volviendo al inicio para un nuevo cliente...";
                    setTimeout(function () { window.location.href = "/"; }, 3500);
                } else {
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
