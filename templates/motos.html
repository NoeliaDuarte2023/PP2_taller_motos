<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de motos - Taller de Motos</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
    <header class="barra">
        <div class="barra__marca"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#f5b800" stroke-width="4"/><circle cx="16" cy="16" r="3.2" fill="#f5b800"/><g stroke="#f5b800" stroke-width="1.6" stroke-linecap="round"><path d="M16 4v8M16 20v8M4 16h8M20 16h8"/></g></svg><span>Taller de Motos</span></div>
        <a href="/logout">Cerrar sesión</a>
    </header>
    <div class="franja"></div>
    <main class="contenido">
        <ol class="pasos" aria-label="Pasos del registro">
            <li class="paso paso--hecho"><span class="paso__numero">✓</span>Cliente</li>
            <li class="paso paso--actual" aria-current="step"><span class="paso__numero">2</span>Moto</li>
            <li class="paso"><span class="paso__numero">3</span>Servicio</li>
        </ol>
        <div class="panel">
            <h1>Registrar moto</h1>
            <p class="bajada">Al guardar, pasás directo a cargar el servicio de esta moto.</p>

            <form id="formMoto">
                <label for="cliente_id">ID del cliente</label>
                <input type="text" id="cliente_id" name="cliente_id" inputmode="numeric">
                <div class="ayuda">El ID aparece en el mensaje al registrar el cliente.</div>

                <label for="patente">Patente</label>
                <input type="text" id="patente" name="patente" autocomplete="off">

                <div class="fila">
                    <div>
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" name="marca">
                    </div>
                    <div>
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" name="modelo">
                    </div>
                </div>

                <label for="anio">Año</label>
                <input type="text" id="anio" name="anio" inputmode="numeric">

                <button type="submit">Registrar moto</button>
            </form>

            <div id="resultado" role="status" aria-live="polite"></div>
            <a class="enlace-volver" href="/">Volver al inicio</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("formMoto");
        const resultado = document.getElementById("resultado");

        // Flujo guiado: si se llega desde el alta de un cliente, el ID viene en la URL
        const idUrl = new URLSearchParams(window.location.search).get("cliente_id");
        if (idUrl && /^[0-9]+$/.test(idUrl)) {
            const campo = document.getElementById("cliente_id");
            campo.value = idUrl;
            campo.readOnly = true;
            document.querySelector("#formMoto .ayuda").textContent =
                "Cliente cargado automaticamente desde el paso anterior.";
        }

        form.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            // Mismo mecanismo que el formulario de clientes: cuerpo form-urlencoded
            // para que Flask lo reciba con request.form
            const datos = new URLSearchParams();
            datos.append("cliente_id", document.getElementById("cliente_id").value);
            datos.append("patente", document.getElementById("patente").value);
            datos.append("marca", document.getElementById("marca").value);
            datos.append("modelo", document.getElementById("modelo").value);
            datos.append("anio", document.getElementById("anio").value);

            try {
                const respuesta = await fetch("/motos", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos
                });

                const data = await respuesta.json();

                resultado.style.display = "block";
                if (respuesta.ok) {
                    resultado.className = "exito";
                    resultado.textContent = "Éxito (" + respuesta.status + "): " + data.mensaje + " ID: " + data.id +
                        ". Pasando al registro del servicio...";
                    // Flujo guiado: se pasa solo a cargar el servicio de esta moto
                    setTimeout(function () {
                        window.location.href = "/servicios/nueva?moto_id=" + encodeURIComponent(data.id);
                    }, 2500);
                } else {
                    resultado.className = "error";
                    resultado.textContent = "Error (" + respuesta.status + "): " + (data.error || JSON.stringify(data));
                }
            } catch (err) {
                resultado.style.display = "block";
                resultado.className = "error";
                resultado.textContent = "No se pudo conectar con el servidor.";
            }
        });
    </script>
</body>
</html>
